<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>GitHub Connection — Tivals AI</title>
  <style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f1115;color:#eef2f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:28px;border:1px solid #2b3038;border-radius:22px;background:#181b21;box-shadow:0 16px 50px #0008}.logo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#24292f;font-weight:900;font-size:22px;margin-bottom:16px}h1{font-size:1.55rem;margin:0 0 12px}.ok{color:#66e0ba}.err{color:#ff8a8a}p{line-height:1.55;color:#c7ccd4}.muted{font-size:.9rem;color:#9299a4}</style>
</head>
<body>
  <main class="card" id="card"></main>
  <script>
    const p = new URLSearchParams(location.search);
    const ok = p.get('ok') === '1';
    const account = String(p.get('account') || 'GitHub account').replace(/[<>&]/g, '');
    const error = String(p.get('error') || 'GitHub connection failed.').replace(/[<>&]/g, '');
    document.getElementById('card').innerHTML = ok
      ? `<div class="logo">GH</div><h1 class="ok">✅ GitHub connected</h1><p><b>${account}</b> is now linked to your Tivals AI Telegram account.</p><p class="muted">You can close this page and return to Telegram.</p>`
      : `<div class="logo">GH</div><h1 class="err">Connection failed</h1><p>${error}</p><p class="muted">Return to Telegram and run <b>/connect</b> to try again.</p>`;
  </script>
</body>
</html>
