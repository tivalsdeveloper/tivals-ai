<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tivals AI · TikTok connection</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#08111f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .card{width:min(520px,100%);background:#101c30;border:1px solid #253550;border-radius:22px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
    .icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:#182946;font-size:34px;margin-bottom:18px}
    h1{font-size:26px;margin:0 0 12px}.ok{color:#64e69b}.bad{color:#ff8585}.msg{color:#cbd6e6;line-height:1.55}.account{font-weight:700;color:#fff}.hint{font-size:14px;color:#8ea3bf;margin-top:18px}
    .btn{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:12px;background:#2b6cff;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🎵</div>
    <h1 id="title">TikTok connection</h1>
    <p class="msg" id="message">Checking connection…</p>
    <a class="btn" href="https://t.me/Tivalsdeveloperbot">Return to Telegram</a>
    <p class="hint">You can close this page after returning to Telegram.</p>
  </main>
  <script>
    const q=new URLSearchParams(location.search);
    const ok=q.get("ok")==="1";
    const account=q.get("account")||"";
    const error=q.get("error")||"";
    const title=document.getElementById("title");
    const msg=document.getElementById("message");
    title.textContent=ok?"TikTok connected":"TikTok connection failed";
    title.className=ok?"ok":"bad";
    msg.innerHTML=ok
      ? "Connected as <span class=\"account\"></span>."
      : (error ? error.replace(/[<>&]/g,"") : "The connection could not be completed.");
    if(ok) msg.querySelector(".account").textContent=account||"TikTok account";
  </script>
</body>
</html>
