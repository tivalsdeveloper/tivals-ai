name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build packaged Android APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Name APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Tivals-AI-v8.0.2.apk

      - name: Verify APK is a packaged app
        run: |
          SIZE=$(stat -c%s Tivals-AI-v8.0.2.apk)
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 3000000 ]; then
            echo "APK is unexpectedly smaller than 3 MB; refusing to publish."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tivals-AI-v8.0.2-APK
          path: Tivals-AI-v8.0.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v8.0.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Tivals-AI-v8.0.2.apk --clobber
          else
            gh release create "$TAG" Tivals-AI-v8.0.2.apk \
              --title "Tivals AI Android v8.0.2" \
              --notes "Improved Android downloads: generated images and other downloadable files are saved to the public Downloads folder with filenames, MIME types, authentication cookies, and completion notifications. Includes the v8.0.1 startup crash fix."
          fi
