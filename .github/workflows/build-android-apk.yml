name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Name APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Tivals-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tivals-AI-APK
          path: Tivals-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v7.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Tivals-AI.apk --clobber
          else
            gh release create "$TAG" Tivals-AI.apk \
              --title "Tivals AI Android v7.0.0" \
              --notes "Tivals AI Android v7. Standalone app-window navigation, refreshed Tivals AI launcher icon, file downloads, notifications, and the live Tivals AI service."
          fi
