name: Fix Telegram loop and fast replies

on:
  push:
    paths:
      - '.github/workflows/fix-telegram-loop-fast-replies.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Telegram bot
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('supabase/functions/tivals-telegram/index.ts')
          s = p.read_text()

          # Add Apinex direct fallback for speed/reliability.
          if 'const APINEX_BASE' not in s:
              s = s.replace('const OPENROUTER_BASE = "https://openrouter.ai/api/v1";\n', 'const OPENROUTER_BASE = "https://openrouter.ai/api/v1";\nconst APINEX_BASE = "https://api.apinex.bond/v1";\n')

          # Ignore every Telegram Business message in this bot chat. Normal direct bot chats use update.message.
          old = '''  const bm=update?.business_message;
  // Ignore outgoing business messages created by this bot, otherwise Telegram
  // sends them back as business_message updates and the bot replies to itself.
  if(bm&&(bm?.sender_business_bot||bm?.via_bot||bm?.from?.is_bot))return json({ok:true,ignored:true,reason:"outgoing-business-message"});
  const message=bm||update?.message;const business=bm?.business_connection_id||undefined;'''
          new = '''  const bm=update?.business_message;
  // This public bot is handled through normal update.message events. Ignore
  // business_message events completely so messages sent on behalf of the
  // connected business account can never be fed back into the AI.
  if(bm)return json({ok:true,ignored:true,reason:"business-message-disabled"});
  const message=update?.message;const business=undefined;'''
          if old in s:
              s = s.replace(old, new)
          elif 'const bm=update?.business_message;' in s and 'business-message-disabled' not in s:
              s = re.sub(r'  const bm=update\?\.business_message;[\s\S]*?  const message=bm\|\|update\?\.message;const business=bm\?\.business_connection_id\|\|undefined;', new, s, count=1)

          # Add a local instant greeting so simple messages never wait on an AI provider.
          marker = '  try{\n    if(text==="/start"||text.startsWith("/start "))'
          if 'route:"local-greeting"' not in s:
              repl = '  try{\n    if(/^(?:hi|hello|hey|good morning|good afternoon|good evening)[!. ]*$/i.test(text)){await sendFormatted(chatId,"👋 **Hello! I’m Tivals AI.**\\n\\nHow can I help you today?");return json({ok:true,route:"local-greeting"});}\n    if(text==="/start"||text.startsWith("/start "))'
              s = s.replace(marker, repl)

          # Add Apinex as another direct parallel provider inside askAI.
          anchor = '  const open=Deno.env.get("OPENROUTER_API_KEY")||"";'
          if 'APINEX_API_KEY' not in s:
              block = '''  const apinex=Deno.env.get("APINEX_API_KEY")||"";
  if(apinex) providers.push((async()=>{
    const {r,d}=await fetchJson(`${APINEX_BASE}/chat/completions`,{method:"POST",headers:{Authorization:`Bearer ${apinex}`,"Content-Type":"application/json"},body:JSON.stringify({model:"free/gemini-3.1-pro",messages,max_tokens:1300,temperature:0.35})},12000);
    const txt=chatContent(d); if(r.ok&&txt) return txt; throw new Error("Apinex failed");
  })());
'''
              s = s.replace(anchor, block + anchor)

          # Make provider race shorter; whichever succeeds first wins.
          s = s.replace('},18000);\n    if(r.ok&&d?.reply)', '},12000);\n    if(r.ok&&d?.reply)')
          s = s.replace('},18000);\n    const txt=chatContent(d);', '},12000);\n    const txt=chatContent(d);')
          s = s.replace('},14000);\n      const txt=chatContent(d);', '},10000);\n      const txt=chatContent(d);')
          s = s.replace('version:19', 'version:20')

          p.write_text(s)

      - name: Commit fix
        run: |
          git config user.name "tivalsdeveloper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/tivals-telegram/index.ts
          git commit -m "Stop Telegram business echo loop and speed up replies" || exit 0
          git push
