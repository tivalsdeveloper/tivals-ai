name: Deploy managed Telegram GitHub group fix

on:
  push:
    paths:
      - '.github/workflows/deploy-managed-group-github.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy managed Telegram bot function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy tivals-user-telegram --project-ref kxuszpixwfecawdeqkrx --no-verify-jwt
