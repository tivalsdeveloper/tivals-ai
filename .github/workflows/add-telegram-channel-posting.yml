name: Add Telegram channel posting

on:
  push:
    paths:
      - '.github/workflows/add-telegram-channel-posting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add channel posting command
        shell: python
        run: |
          from pathlib import Path

          p = Path('supabase/functions/tivals-telegram/index.ts')
          s = p.read_text()

          old_help = 'if(text==="/help"){await sendFormatted(chatId,"**Tivals AI**\\n\\n/connect — Connect Gmail or GitHub\\n/emails — Latest Gmail\\n/unread — Unread Gmail\\n\\nYou can also say **Teach me Python** or **Search networking on YouTube**.",business);return json({ok:true});}'
          new_help = 'if(text==="/help"){await sendFormatted(chatId,"**Tivals AI**\\n\\n/connect — Connect Gmail or GitHub\\n/emails — Latest Gmail\\n/unread — Unread Gmail\\n/channel @channel Your message — Post to a channel you administer\\n\\nYou can also say **Teach me Python** or **Search networking on YouTube**.",business);return json({ok:true});}'
          if old_help in s:
              s = s.replace(old_help, new_help)

          marker = '    if(text==="/accounts"){if(!tg)throw new Error("Telegram user ID unavailable.");const d=await oauthCall("status",tg);const list=Array.isArray(d?.connections)?d.connections:[];await sendFormatted(chatId,list.length?`**Connected accounts**\\n\\n${list.map((x:any)=>`• ${x.provider}: ${x.account_label||"Connected"}`).join("\\n")}`:"**Connected accounts**\\n\\nNo accounts connected.",business);return json({ok:true});}\n'

          channel_block = '''    if(/^\\/channel(?:@\\w+)?(?:\\s|$)/i.test(text)){
      if(message?.chat?.type!=="private"){
        await sendFormatted(chatId,"⚠️ Use /channel from a private chat with me.");
        return json({ok:false,route:"channel-post"});
      }
      if(!tg)throw new Error("Telegram user ID unavailable.");
      const m=text.match(/^\\/channel(?:@\\w+)?\\s+(@[A-Za-z0-9_]{5,}|-100\\d+)\\s+([\\s\\S]+)$/i);
      if(!m){
        await sendFormatted(chatId,"**Channel posting**\\n\\nUse: `/channel @channelusername Your message`\\n\\nFirst add me to the channel as an administrator with permission to post messages.");
        return json({ok:false,route:"channel-post-help"});
      }
      const target=m[1]; const channelText=m[2].trim();
      const member=await telegram("getChatMember",{chat_id:target,user_id:tg});
      const status=String(member?.result?.status||"");
      if(!["creator","administrator"].includes(status)){
        await sendFormatted(chatId,"⚠️ You must be an administrator of that channel before you can post through Tivals AI.");
        return json({ok:false,route:"channel-post-denied"});
      }
      try{
        await sendFormatted(target,channelText);
        await sendFormatted(chatId,`✅ Posted to **${target}**.`);
        return json({ok:true,route:"channel-post"});
      }catch(e){
        const msg=String((e as Error)?.message||e||"");
        if(/not enough rights|CHAT_ADMIN_REQUIRED|forbidden|not found/i.test(msg)){
          await sendFormatted(chatId,"⚠️ I couldn't post there. Add Tivals AI to the channel as an administrator and enable **Post Messages**, then try again.");
          return json({ok:false,route:"channel-post-permission"});
        }
        throw e;
      }
    }
'''

          if 'route:"channel-post"' not in s:
              if marker not in s:
                  raise SystemExit('Could not find accounts command insertion point')
              s = s.replace(marker, marker + channel_block)

          s = s.replace('version:20,callback_buttons:false', 'version:21,callback_buttons:false')
          p.write_text(s)

      - name: Commit change
        run: |
          git config user.name "tivalsdeveloper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/tivals-telegram/index.ts
          git commit -m "Add secure Telegram channel posting" || exit 0
          git push
