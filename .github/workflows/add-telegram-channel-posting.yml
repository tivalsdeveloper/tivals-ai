name: Add Telegram channel posting

on:
  push:
    paths:
      - '.github/workflows/add-telegram-channel-posting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add channel posting command
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('supabase/functions/tivals-telegram/index.ts')
          s = p.read_text()
          old_help = 'if(text==="/help"){await sendFormatted(chatId,"**Tivals AI**\\n\\n/connect — Connect Gmail or GitHub\\n/emails — Latest Gmail\\n/unread — Unread Gmail\\n\\nYou can also say **Teach me Python** or **Search networking on YouTube**.",business);return json({ok:true});}'
          new_help = 'if(text==="/help"){await sendFormatted(chatId,"**Tivals AI**\\n\\n/connect — Connect Gmail or GitHub\\n/emails — Latest Gmail\\n/unread — Unread Gmail\\n/channel @channel Your message — Post to a channel you administer\\n\\nYou can also say **Teach me Python** or **Search networking on YouTube**.",business);return json({ok:true});}'
          if old_help in s:
              s = s.replace(old_help, new_help)
          marker = '    if(text==="/accounts"){if(!tg)throw new Error("Telegram user ID unavailable.");const d=await oauthCall("status",tg);const list=Array.isArray(d?.connections)?d.connections:[];await sendFormatted(chatId,list.length?`**Connected accounts**\\n\\n${list.map((x:any)=>`• ${x.provider}: ${x.account_label||"Connected"}`).join("\\n")}`:"**Connected accounts**\\n\\nNo accounts connected.",business);return json({ok:true});}\n'
          block = base64.b64decode('').decode()
          if 'route:"channel-post"' not in s:
              if marker not in s:
                  raise SystemExit('Could not find accounts command insertion point')
              s = s.replace(marker, marker + block)
          s = s.replace('version:20,callback_buttons:false', 'version:21,callback_buttons:false')
          p.write_text(s)
      - name: Commit change
        run: |
          git config user.name "tivalsdeveloper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/tivals-telegram/index.ts
          git commit -m "Add secure Telegram channel posting" || exit 0
          git push
