<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tivals AI</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#090b10;color:#f5f7fb}.app{min-height:100dvh;max-width:920px;margin:auto}.top{padding:12px 16px;border-bottom:1px solid #252a35;display:grid;grid-template-columns:minmax(130px,1fr) 190px 46px;gap:9px;align-items:center;position:sticky;top:0;background:#090b10f2;z-index:2}.brand{font-weight:800;font-size:19px;display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap}.logo{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#00c2ff);display:grid;place-items:center}.model{width:190px;min-width:0;background:#151923;color:#fff;border:1px solid #303644;border-radius:10px;padding:9px;overflow:hidden;text-overflow:ellipsis}.new{width:46px;height:40px;border:1px solid #303644;background:#151923;color:#fff;border-radius:10px;padding:0;font-size:0;display:grid;place-items:center}.new:after{content:'＋';font-size:22px}.chat{padding:20px 14px 145px}.welcome{text-align:center;margin:13vh auto 25px;max-width:600px}.welcome h1{font-size:clamp(30px,7vw,48px);margin:0 0 10px}.welcome p{color:#9da7b8;line-height:1.55}.msg{max-width:790px;margin:15px auto;display:flex}.msg.user{justify-content:flex-end}.bubble{padding:13px 15px;border-radius:18px;line-height:1.6;overflow-wrap:anywhere}.user .bubble{background:#6c4cff;max-width:86%;white-space:pre-wrap}.ai .bubble{background:#151923;border:1px solid #252b38;max-width:96%;width:min(96%,790px)}.ai p{margin:0 0 12px}.ai p:last-child{margin-bottom:0}.codebox{margin:12px 0;border:1px solid #303746;border-radius:12px;overflow:hidden;background:#06080c}.codehead{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;background:#11151d;color:#aeb7c7;font-size:12px}.copy{border:1px solid #394252;background:#1a202b;color:#fff;border-radius:7px;padding:5px 9px}.codebox pre{margin:0;padding:14px;overflow:auto;white-space:pre;line-height:1.5;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}.composerWrap{position:fixed;bottom:0;left:0;right:0;padding:12px 14px 18px;background:linear-gradient(transparent,#090b10 25%)}.composer{max-width:870px;margin:auto;border:1px solid #303746;background:#151923;border-radius:20px;padding:10px}.row{display:flex;gap:8px}textarea{flex:1;resize:none;min-height:48px;max-height:150px;background:transparent;color:#fff;border:0;outline:0;padding:12px;font:inherit}.send{width:48px;height:48px;border:0;border-radius:14px;background:#7657ff;color:#fff;font-size:20px}.meta{text-align:center;color:#737d8e;font-size:11px;margin-top:7px}@media(max-width:600px){.top{padding:9px;grid-template-columns:minmax(112px,1fr) 125px 42px;gap:7px}.brand{font-size:16px}.logo{width:34px;height:34px;flex-basis:34px}.model{width:125px;padding:8px 6px}.new{width:42px;height:38px}.chat{padding-left:9px;padding-right:9px}.welcome{margin-top:9vh}.ai .bubble{max-width:100%}}@media(max-width:380px){.top{grid-template-columns:minmax(92px,1fr) 108px 40px}.brand{font-size:14px;gap:6px}.logo{width:31px;height:31px;flex-basis:31px;border-radius:10px}.model{width:108px;font-size:12px}.new{width:40px}}</style></head>
<body><main class="app"><header class="top"><div class="brand"><span class="logo">AI</span>Tivals AI</div><select id="model" class="model"><option>Loading models…</option></select><button class="new" id="newChat" aria-label="New chat">＋ New chat</button></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>How can I help?</h1><p>Write, explain, debug and improve code — or ask anything else.</p></div></section></main><div class="composerWrap"><div class="composer"><div class="row"><textarea id="prompt" rows="1" placeholder="Ask Tivals AI to write code..."></textarea><button class="send" id="send">➤</button></div><div class="meta">Powered by tivalsdeveloper</div></div></div>
<script>
const API='https://kxuszpixwfecawdeqkrx.supabase.co/functions/v1/ai-tutor';
const chat=document.querySelector('#chat'),prompt=document.querySelector('#prompt'),welcome=document.querySelector('#welcome'),model=document.querySelector('#model');let history=JSON.parse(localStorage.getItem('tivals-ai-history')||'[]');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderAI(text){const parts=String(text).split(/```/);return parts.map((p,i)=>{if(i%2===0)return '<p>'+esc(p).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';let nl=p.indexOf('\n'),lang=nl>=0?p.slice(0,nl).trim():'code',code=nl>=0?p.slice(nl+1):p;return '<div class="codebox"><div class="codehead"><span>'+esc(lang||'code')+'</span><button class="copy" onclick="copyCode(this)">Copy</button></div><pre><code>'+esc(code.trim())+'</code></pre></div>'}).join('')}
function copyCode(btn){navigator.clipboard.writeText(btn.closest('.codebox').querySelector('code').textContent).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200)})}
function add(role,text){welcome.style.display='none';const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="bubble">'+(role==='ai'?renderAI(text):esc(text))+'</div>';chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}history.forEach(x=>add(x.role==='assistant'?'ai':'user',x.content));
async function loadModels(){try{const r=await fetch(API+'?models=1');const d=await r.json();model.innerHTML='';(d.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.name||m.id;model.appendChild(o)});if(!model.options.length)throw 0}catch{model.innerHTML='<option value="free/gemini-3.1-pro">Gemini 3.1 Pro</option>'}}
async function send(){const text=prompt.value.trim();if(!text)return;prompt.value='';add('user',text);history.push({role:'user',content:text});localStorage.setItem('tivals-ai-history',JSON.stringify(history));const wait=add('ai','Thinking…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model.value,messages:history.slice(-12)})});const d=await r.json();if(!r.ok)throw new Error(d.error||'AI request failed.');wait.remove();const reply=d.reply||'No response received.';add('ai',reply);history.push({role:'assistant',content:reply});localStorage.setItem('tivals-ai-history',JSON.stringify(history))}catch(e){wait.querySelector('.bubble').textContent=e.message||'Unable to reach Tivals AI.'}}
document.querySelector('#send').onclick=send;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelector('#newChat').onclick=()=>{history=[];localStorage.removeItem('tivals-ai-history');chat.querySelectorAll('.msg').forEach(x=>x.remove());welcome.style.display='block'};loadModels();
</script></body></html>
