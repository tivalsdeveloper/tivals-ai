<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tivals AI</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#090b10;color:#f5f7fb}.app{min-height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{padding:14px 16px;border-bottom:1px solid #252a35;display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#090b10f2;z-index:2}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#00c2ff);display:grid;place-items:center}.model{margin-left:auto;max-width:180px;background:#151923;color:#fff;border:1px solid #303644;border-radius:10px;padding:9px}.new{border:1px solid #303644;background:#151923;color:#fff;border-radius:10px;padding:9px 11px}.chat{flex:1;padding:20px 14px 140px}.welcome{text-align:center;margin:14vh auto 25px;max-width:580px}.welcome h1{font-size:clamp(30px,7vw,48px);margin:0 0 10px}.welcome p{color:#9da7b8}.msg{max-width:760px;margin:14px auto;display:flex}.msg.user{justify-content:flex-end}.bubble{padding:12px 15px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#6c4cff;max-width:86%}.ai .bubble{background:#151923;border:1px solid #252b38;max-width:94%}.composerWrap{position:fixed;bottom:0;left:0;right:0;padding:12px 14px 18px;background:linear-gradient(transparent,#090b10 25%)}.composer{max-width:850px;margin:auto;border:1px solid #303746;background:#151923;border-radius:20px;padding:10px}.row{display:flex;gap:8px}textarea{flex:1;resize:none;min-height:48px;max-height:150px;background:transparent;color:#fff;border:0;outline:0;padding:12px;font:inherit}.send{width:48px;height:48px;border:0;border-radius:14px;background:#7657ff;color:#fff;font-size:20px}.meta{text-align:center;color:#737d8e;font-size:11px;margin-top:7px}@media(max-width:600px){.top{padding:10px}.brand{font-size:17px}.model{max-width:120px}.new{font-size:0}.new:after{content:'＋';font-size:20px}.chat{padding-left:10px;padding-right:10px}.welcome{margin-top:10vh}}</style></head>
<body><main class="app"><header class="top"><div class="brand"><span class="logo">AI</span>Tivals AI</div><select id="model" class="model"><option>Loading models…</option></select><button class="new" id="newChat">＋ New chat</button></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>How can I help?</h1><p>Ask questions, learn, brainstorm, write, plan, or get help with code.</p></div></section></main><div class="composerWrap"><div class="composer"><div class="row"><textarea id="prompt" rows="1" placeholder="Message Tivals AI..."></textarea><button class="send" id="send">➤</button></div><div class="meta">Powered by tivalsdeveloper</div></div></div>
<script>
const API='https://kxuszpixwfecawdeqkrx.supabase.co/functions/v1/ai-tutor';
const chat=document.querySelector('#chat'),prompt=document.querySelector('#prompt'),welcome=document.querySelector('#welcome'),model=document.querySelector('#model');
let history=JSON.parse(localStorage.getItem('tivals-ai-history')||'[]');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function add(role,text){welcome.style.display='none';const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="bubble">'+esc(text)+'</div>';chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}
history.forEach(x=>add(x.role,x.content));
async function loadModels(){try{const r=await fetch(API+'?models=1');const d=await r.json();model.innerHTML='';(d.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.name||m.id;model.appendChild(o)});if(!model.options.length)throw 0}catch{model.innerHTML='<option value="free/gemini-3.1-pro">Gemini 3.1 Pro</option>'}}
async function send(){const text=prompt.value.trim();if(!text)return;prompt.value='';add('user',text);history.push({role:'user',content:text});localStorage.setItem('tivals-ai-history',JSON.stringify(history));const wait=add('ai','Thinking…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model.value,messages:history.slice(-12)})});const d=await r.json();if(!r.ok)throw new Error(d.error||'AI request failed.');wait.remove();const reply=d.reply||'No response received.';add('ai',reply);history.push({role:'assistant',content:reply});localStorage.setItem('tivals-ai-history',JSON.stringify(history))}catch(e){wait.querySelector('.bubble').textContent=e.message||'Unable to reach Tivals AI.'}}
document.querySelector('#send').onclick=send;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelector('#newChat').onclick=()=>{history=[];localStorage.removeItem('tivals-ai-history');chat.querySelectorAll('.msg').forEach(x=>x.remove());welcome.style.display='block'};loadModels();
</script></body></html>
