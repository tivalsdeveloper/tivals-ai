<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tivals AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090b10;color:#f5f7fb}.app{min-height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{padding:16px 18px;border-bottom:1px solid #252a35;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#090b10ee;backdrop-filter:blur(10px)}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#00c2ff);display:grid;place-items:center}.new{border:1px solid #303644;background:#151923;color:white;border-radius:10px;padding:9px 12px}.chat{flex:1;padding:22px 16px 140px;overflow:auto}.welcome{text-align:center;margin:14vh auto 25px;max-width:600px}.welcome h1{font-size:clamp(30px,7vw,48px);margin:0 0 10px}.welcome p{color:#9da7b8;line-height:1.6}.msg{max-width:760px;margin:14px auto;display:flex}.msg.user{justify-content:flex-end}.bubble{padding:12px 15px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#6c4cff;max-width:82%}.ai .bubble{background:#151923;border:1px solid #252b38;max-width:92%}pre{background:#07090d;padding:14px;border-radius:12px;overflow:auto}.composerWrap{position:fixed;bottom:0;left:0;right:0;padding:12px 14px 18px;background:linear-gradient(transparent,#090b10 28%)}.composer{max-width:850px;margin:auto;border:1px solid #303746;background:#151923;border-radius:20px;padding:10px;box-shadow:0 12px 40px #0008}.row{display:flex;gap:8px}textarea{flex:1;resize:none;max-height:160px;min-height:48px;background:transparent;color:white;border:0;outline:0;padding:12px;font:inherit}.send{width:48px;height:48px;border:0;border-radius:14px;background:#7657ff;color:white;font-size:20px}.meta{text-align:center;color:#737d8e;font-size:11px;margin-top:7px}@media(max-width:600px){.top{padding:12px}.chat{padding-left:11px;padding-right:11px}.welcome{margin-top:10vh}.user .bubble{max-width:90%}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand"><span class="logo">AI</span>Tivals AI</div><button class="new" id="newChat">＋ New chat</button></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>How can I help?</h1><p>Ask questions, learn, brainstorm, write, or get help with code.</p></div></section></main><div class="composerWrap"><div class="composer"><div class="row"><textarea id="prompt" rows="1" placeholder="Message Tivals AI..."></textarea><button class="send" id="send">➤</button></div><div class="meta">Powered by tivalsdeveloper</div></div></div>
<script>
const chat=document.querySelector('#chat'),prompt=document.querySelector('#prompt'),welcome=document.querySelector('#welcome');
let history=JSON.parse(localStorage.getItem('tivals-ai-history')||'[]');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function add(role,text){welcome.style.display='none';const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="bubble">'+esc(text)+'</div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
history.forEach(x=>add(x.role,x.text));
async function send(){const text=prompt.value.trim();if(!text)return;prompt.value='';add('user',text);history.push({role:'user',text});localStorage.setItem('tivals-ai-history',JSON.stringify(history));const thinking=add('ai','Thinking…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-12)})});if(!r.ok)throw new Error();const data=await r.json();thinking.remove();const reply=data.reply||'No response received.';add('ai',reply);history.push({role:'ai',text:reply});localStorage.setItem('tivals-ai-history',JSON.stringify(history))}catch(e){thinking.querySelector('.bubble').textContent='AI backend is not connected yet. The interface is ready; connect /api/chat to enable live AI responses.'}}
document.querySelector('#send').onclick=send;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelector('#newChat').onclick=()=>{history=[];localStorage.removeItem('tivals-ai-history');chat.querySelectorAll('.msg').forEach(x=>x.remove());welcome.style.display='block'};
</script></body></html>
