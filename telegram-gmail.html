<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Connect Gmail — Tivals AI</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f1115;color:#eef2f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:28px;border:1px solid #2b3038;border-radius:22px;background:#181b21;box-shadow:0 16px 50px #0008}.logo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#10a37f;font-weight:900;font-size:20px;margin-bottom:16px}h1{font-size:1.55rem;margin:0 0 12px}p{line-height:1.55;color:#c7ccd4}.btn{width:100%;border:0;border-radius:14px;padding:14px 18px;margin-top:12px;background:#f4f4f4;color:#151515;font-weight:800;font-size:1rem}.btn:disabled{opacity:.6}.muted{font-size:.9rem;color:#9299a4}.ok{color:#66e0ba}.err{color:#ff8a8a}
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="logo">T</div>
    <h1>Connect Gmail to Tivals AI</h1>
    <p>Tivals AI will ask Google for permission to read Gmail and send messages only when you ask it to.</p>
    <button class="btn" id="connect">Continue with Google</button>
    <p class="muted" id="status">You can disconnect Gmail later from Telegram with <b>/disconnect_gmail</b>.</p>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://kxuszpixwfecawdeqkrx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__auyhjNpepXiYdGV5HEJ_A_AGsPbBuS';
    const COMPLETE_URL = 'https://kxuszpixwfecawdeqkrx.supabase.co/functions/v1/telegram-oauth';
    const SCOPES = 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true }
    });

    const card = document.getElementById('card');
    const btn = document.getElementById('connect');
    const status = document.getElementById('status');
    const params = new URLSearchParams(location.search);
    const state = params.get('state') || '';
    const callbackUrl = `${location.origin}${location.pathname}?state=${encodeURIComponent(state)}`;

    function safe(value){return String(value || '').replace(/[<>&]/g,'');}

    async function finishConnection() {
      try {
        status.textContent = 'Finishing Gmail connection…';

        const hash = new URLSearchParams(location.hash.slice(1));
        let providerToken = hash.get('provider_token') || '';
        let providerRefreshToken = hash.get('provider_refresh_token') || '';

        if (!providerToken) {
          const { data } = await supabase.auth.getSession();
          providerToken = data?.session?.provider_token || '';
          providerRefreshToken = data?.session?.provider_refresh_token || '';
        }

        if (!providerToken) return false;

        const response = await fetch(COMPLETE_URL, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            action: 'complete_gmail',
            state,
            provider_token: providerToken,
            provider_refresh_token: providerRefreshToken
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data?.error || 'Gmail connection failed.');

        history.replaceState(null, '', location.pathname);
        card.innerHTML = `<div class="logo">T</div><h1 class="ok">✅ Gmail connected</h1><p><b>${safe(data?.account || 'Google account')}</b> is now linked to your Tivals AI Telegram account.</p><p class="muted">You can close this page and return to Telegram.</p>`;
        return true;
      } catch (error) {
        card.innerHTML = `<div class="logo">T</div><h1 class="err">Connection failed</h1><p>${safe(error?.message || error)}</p><p class="muted">Return to Telegram and use <b>/connect</b> to try again.</p>`;
        return true;
      }
    }

    if (!state) {
      btn.disabled = true;
      status.textContent = 'This connection link is invalid. Return to Telegram and run /connect again.';
    } else if (!(await finishConnection())) {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        status.textContent = 'Opening Google…';
        const { data, error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: callbackUrl,
            scopes: SCOPES,
            queryParams: { access_type: 'offline', prompt: 'consent' }
          }
        });
        if (error) {
          status.textContent = error.message;
          btn.disabled = false;
          return;
        }
        if (data?.url) location.href = data.url;
      });
    }
  </script>
</body>
</html>
